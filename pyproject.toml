[project]
name = "finance-sentiment-engine"
version = "0.2.0"
description = "Multi-provider LLM agent for financial news sentiment analysis and investment brief generation"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.102.0",
    "beautifulsoup4>=4.14.3",
    "cohere>=5.21.1",
    "feedparser>=6.0.12",
    "groq>=1.2.0",
    "langchain>=1.3.1",
    "langsmith>=0.3.0",
    "langchain-cohere>=0.5.1",
    "langchain-openai>=1.2.1",
    "langchain-qdrant>=1.1.0",
    "langgraph>=1.2.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "lxml>=6.1.1",
    "numpy>=2.4.6",
    "openai>=2.36.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "requests>=2.34.2",
    "sentence-transformers>=5.5.1",
    "structlog>=25.5.0",
    "tavily-python>=0.7.25",
    "tenacity>=9.1.4",
    "tiktoken>=0.13.0",
    "yfinance>=1.4.1",
    "braintrust>=0.0.170",
    "autoevals>=0.0.73",
    "ragas>=0.4.3",
    "fastapi>=0.138.1",
    "uvicorn>=0.49.0",
    "redis>=8.0.1",
]

[project.scripts]
brief = "brief:main"

[tool.setuptools]
py-modules = ["brief"]

[tool.setuptools.packages.find]
include = ["agent*", "analyzer*", "graph*", "parser*", "providers*", "rag*", "report*", "scraper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: marks tests as slow (live network calls, skipped by default)"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
